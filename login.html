<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MANU JOYEROS</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f5f9;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        .login-card img {
            max-width: 200px;
            margin-bottom: 1.5rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #0f172a;
        }
        .btn-login {
            width: 100%;
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-login:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        #lblMensaje {
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 500;
        }
        .msg-error { background: #fee2e2; color: #ef4444; }
        .msg-info { background: #e0f2fe; color: #0284c7; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="./manu_joyeros.jpg" alt="MANU JOYEROS">
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingrese su usuario" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnSubmit">Ingresar al Sistema</button>
            <div id="lblMensaje"></div>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.75rem; color: #94a3b8;">Versión V1.1715 • MANU JOYEROS</p>
    </div>

    <!-- Referencias a tus módulos core -->
    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuarioInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const btnSubmit = document.getElementById('btnSubmit');
            const lblMensaje = document.getElementById('lblMensaje');

            // Resetear UI
            lblMensaje.style.display = 'none';
            lblMensaje.className = '';
            
            if (!usuarioInput || !passwordInput) {
                mostrarMensaje('⚠️ Por favor ingrese su usuario y contraseña.', 'msg-error');
                return;
            }

            // Estado de carga
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Verificando credenciales...';

            try {
                // Llamada rápida a Google Apps Script a través de tu api.js
                const res = await API.llamar("login", {
                    action: "login",
                    usuario: usuarioInput.toUpperCase(),
                    password: passwordInput
                }, "POST");

                if (res && res.status === "success") {
                    let usuarioData = res.data;
                    
                    // 1. Validación estricta y rápida de fecha de vencimiento
                    if (usuarioData.Vencimiento) {
                        let fechaVencimiento = new Date(usuarioData.Vencimiento);
                        let hoy = new Date();
                        // Eliminamos la hora para comparar solo las fechas
                        hoy.setHours(0,0,0,0);
                        if (fechaVencimiento < hoy) {
                            mostrarMensaje('❌ Su cuenta ha vencido. Contacte al administrador.', 'msg-error');
                            btnSubmit.disabled = false;
                            btnSubmit.textContent = 'Ingresar al Sistema';
                            return;
                        }
                    }

                    // 2. Control estricto de máximo 2 sesiones simultáneas
                    const claveStorage = `sesiones_${usuarioData.usuario}`;
                    let sesionesActivas = JSON.parse(localStorage.getItem(claveStorage) || "[]");
                    
                    // Generamos un identificador único para esta nueva sesión
                    const tokenActual = 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                    
                    // Añadimos la sesión actual al registro
                    sesionesActivas.push({
                        token: tokenActual,
                        timestamp: Date.now()
                    });

                    // Regla de oro: Si hay más de 2 sesiones, eliminamos la más antigua (la primera de la lista)
                    if (sesionesActivas.length > 2) {
                        sesionesActivas.shift(); 
                    }

                    // Guardamos la información en el navegador
                    localStorage.setItem(claveStorage, JSON.stringify(sesionesActivas));
                    localStorage.setItem("sesion_token_actual", tokenActual);
                    localStorage.setItem("usuario_activo", JSON.stringify(usuarioData));

                    // 3. Redirección inmediata
                    mostrarMensaje('✅ Acceso correcto, ingresando...', 'msg-info');
                    window.location.href = "./index.html";
                    
                } else {
                    mostrarMensaje("❌ " + (res ? res.message : "Usuario o contraseña incorrectos."), 'msg-error');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Ingresar al Sistema';
                }
            } catch (error) {
                console.error(error);
                mostrarMensaje('❌ Error de conexión. Intente nuevamente.', 'msg-error');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Ingresar al Sistema';
            }
        });

        function mostrarMensaje(texto, clase) {
            const lbl = document.getElementById('lblMensaje');
            lbl.textContent = texto;
            lbl.className = clase;
            lbl.style.display = 'block';
        }
    </script>
</body>
</html>
